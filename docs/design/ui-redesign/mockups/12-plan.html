<!doctype html>

<style>

<body>
<div style="width: 390px; height: 880px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #16181C; font-family: 'IBM Plex Sans SC', 'Noto Sans SC', sans-serif">

<div style="height: 60px; box-sizing: border-box; padding: 16px 8px 0 8px; display: flex; align-items: center; gap: 4px">

</a>
<div style="flex: 1 1 0; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">检查连接恢复逻辑</div>

<div style="margin-top: 6px; display: flex; flex-direction: column">

<span style="font-size: 15px; line-height: 22px; color: #5F646C">读连接状态和会话订阅的代码</span>

<div style="padding: 11px 0; display: flex; align-items: flex-start; gap: 12px; border-top: 1px solid #E9E8E3">

</div>

<div style="padding: 11px 0 6px 0; display: flex; align-items: flex-start; gap: 12px; border-top: 1px solid #E9E8E3">

<a href="04-approval.html" style="align-self: flex-start; height: 44px; display: flex; align-items: center; gap: 4px; font-size: 13px; text-decoration: underline; text-underline-offset: 4px">去处理</a>
</div>
</div>

<div style="padding: 11px 0; display: flex; align-items: flex-start; gap: 12px; border-top: 1px solid #E9E8E3; border-bottom: 1px solid #E9E8E3">

</div>
<div style="display: flex; align-items: baseline; gap: 12px">
<span style="flex-shrink: 0; width: 64px; font-size: 12px; color: #5F646C">5 分钟前</span>
