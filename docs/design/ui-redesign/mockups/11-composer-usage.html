<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>输入框展开与用量</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>

body{margin:0;background:#E9E8E3;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#16181C;text-decoration:none}a:hover{color:#000000}
</style>
</head>
<body>
<div style="width: 390px; height: 880px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #16181C; font-family: 'IBM Plex Sans SC', 'Noto Sans SC', sans-serif">

<div style="height: 60px; box-sizing: border-box; padding: 16px 8px 0 8px; display: flex; align-items: center; gap: 4px">
<a href="02-chat.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">优化通知展示</span>
<span style="font-size: 12px; line-height: 16px; color: #5F646C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">工作电脑 · DSHRemote · 改文件不问</span>
</div>
<span aria-hidden="true" style="flex-shrink: 0; width: 12px"></span>
</div>

<div style="margin-top: 4px; height: 44px; box-sizing: border-box; padding: 0 20px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #E9E8E3; border-bottom: 1px solid #E9E8E3; font-size: 13px">
<span style="flex-shrink: 0; color: #5F646C">第 3 步，共 5 步</span>
<span style="flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">补测试并跑通</span>
</div>

<div style="box-sizing: border-box; padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 18px">

<div style="align-self: flex-end; max-width: 280px; padding: 9px 14px; background: #F1F0EC; border-radius: 18px; font-size: 15px; line-height: 24px">通知里同一个审批会重复出现，帮我查一下原因并修掉。</div>

<p style="margin: 0; font-size: 15px; line-height: 26px">找到原因了。同一个审批会从两条路径进来，去重用的键不一样。我把两处统一成一个入口。</p>

<div style="align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 22px; color: #5F646C">
<span>5 个步骤 · 改了 2 个文件</span>
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</div>

<div style="display: flex; align-items: center; gap: 10px; color: #5F646C">
<span aria-hidden="true" style="box-sizing: border-box; width: 10px; height: 10px; border-radius: 5px; border: 1.5px solid #D5D4CE; border-top-color: #16181C"></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 20px; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">./gradlew test</span>
<span style="flex-shrink: 0; font-size: 12px; line-height: 20px">本轮 4:12 · 约 48k token</span>
</div>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 8px 16px 28px 16px; background: #FAFAF8">
<div style="box-sizing: border-box; padding: 12px 6px 6px 16px; background: #FFFFFF; border: 1px solid #16181C; border-radius: 22px; display: flex; flex-direction: column">
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden">消息</label>
<textarea id="msg" rows="2" style="width: 100%; box-sizing: border-box; padding: 0 10px 0 0; background: none; border: none; outline: none; resize: none; font: inherit; font-size: 15px; line-height: 24px; color: #16181C">顺便核对一下通知文案，尤其是锁屏时显示的那一句。</textarea>

<div style="margin: 10px 10px 0 0; padding: 12px 0; border-top: 1px solid #E9E8E3; border-bottom: 1px solid #E9E8E3; display: flex; flex-direction: column">
<div style="display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; line-height: 20px">
<span style="color: #5F646C">上下文</span>
<span>用了不到一半</span>
</div>
<div role="img" aria-label="上下文已用约 46%" style="margin-top: 10px; height: 4px; border-radius: 2px; background: #E9E8E3">
<div style="width: 46%; height: 4px; border-radius: 2px; background: #5F646C"></div>
</div>
<div style="margin-top: 8px; font-size: 12px; line-height: 18px; color: #5F646C">约 59k，上限 128k · 估算值</div>
<div style="margin-top: 12px; display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; line-height: 20px">
<span style="color: #5F646C">这次会话</span>
<span>输入 182k · 输出 12k</span>
</div>
<div style="margin-top: 6px; display: flex; align-items: baseline; justify-content: space-between; font-size: 13px; line-height: 20px">
<span style="color: #5F646C">缓存命中</span>
<span>71%</span>
</div>
</div>

<div style="margin-left: -12px; display: flex; align-items: center; gap: 2px">
<button aria-label="添加图片" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
</button>
<button style="flex-shrink: 0; height: 44px; padding: 0 4px; display: flex; align-items: center; gap: 3px; background: none; border: none; font-size: 13px; color: #5F646C">
<span>deepseek-chat</span>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<button style="flex-shrink: 0; height: 44px; padding: 0 4px; display: flex; align-items: center; gap: 3px; background: none; border: none; font-size: 13px; color: #5F646C">
<span>改文件不问</span>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<span aria-hidden="true" style="flex: 1 1 0"></span>
<button aria-label="发送。上下文用了不到一半，再长按收起用量" style="flex-shrink: 0; width: 44px; height: 44px; margin-right: -2px; padding: 0; background: none; border: none; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18.5" stroke="#E3E2DD" stroke-width="2.5"></circle><circle cx="20" cy="20" r="18.5" stroke="#5F646C" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="53.5 117" transform="rotate(-90 20 20)"></circle><circle cx="20" cy="20" r="14.5" fill="#16181C"></circle><path d="M20 26V14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path><path d="M15 19l5-5 5 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</div>
</div>

</div>
</body>
</html>
