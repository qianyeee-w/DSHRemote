<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>限时提问超时后</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>

body{margin:0;background:#E9E8E3;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#16181C;text-decoration:none}a:hover{color:#000000}
</style>
</head>
<body>
<div style="width: 390px; height: 880px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #16181C; font-family: 'IBM Plex Sans SC', 'Noto Sans SC', sans-serif">

<div style="height: 60px; box-sizing: border-box; padding: 16px 8px 0 8px; display: flex; align-items: center; gap: 4px">
<a href="01-home.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">导入旧笔记</span>
<span style="font-size: 12px; line-height: 16px; color: #5F646C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">工作电脑 · 笔记应用 · 每次都问</span>
</div>
<span aria-hidden="true" style="flex-shrink: 0; width: 12px"></span>
</div>

<div style="box-sizing: border-box; padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 18px">

<div style="align-self: flex-end; max-width: 280px; padding: 9px 14px; background: #F1F0EC; border-radius: 18px; font-size: 15px; line-height: 24px">把 export 目录里的旧笔记导进来。</div>

<p style="margin: 0; font-size: 15px; line-height: 26px">找到 214 条旧笔记，格式都没有问题。导入之前有一件事需要你来定。</p>

<div style="padding: 14px 16px 6px 16px; background: #FFFFFF; border: 1px solid #E3E2DD; border-radius: 18px; display: flex; flex-direction: column">
<div style="font-size: 12px; line-height: 18px; color: #5F646C">等了 5 分钟没有回答，DSH 先继续了</div>
<div style="margin-top: 8px; font-size: 15px; line-height: 24px; font-weight: 600">要保留旧笔记原来的时间戳吗？</div>
<p style="margin: 6px 0 0 0; font-size: 13px; line-height: 21px; color: #5F646C">现在回答，它仍然会收到。</p>
<div style="margin-top: 4px; display: flex; flex-wrap: wrap; column-gap: 6px">
<button style="height: 44px; padding: 0; background: none; border: none; display: flex; align-items: center"><span style="height: 34px; padding: 0 14px; display: flex; align-items: center; background: #F1F0EC; border-radius: 17px; font-size: 13px">保留原时间</span></button>
<button style="height: 44px; padding: 0; background: none; border: none; display: flex; align-items: center"><span style="height: 34px; padding: 0 14px; display: flex; align-items: center; background: #F1F0EC; border-radius: 17px; font-size: 13px">用导入时间</span></button>
<button style="height: 44px; padding: 0; background: none; border: none; display: flex; align-items: center"><span style="height: 34px; padding: 0 14px; display: flex; align-items: center; background: #F1F0EC; border-radius: 17px; font-size: 13px">两个都存</span></button>
</div>
</div>

<p style="margin: 0; font-size: 15px; line-height: 26px">时间戳的事我先放着，继续做不受它影响的部分：检查重复的笔记。</p>

<div style="display: flex; align-items: center; gap: 10px; color: #5F646C">
<span aria-hidden="true" style="box-sizing: border-box; width: 10px; height: 10px; border-radius: 5px; border: 1.5px solid #D5D4CE; border-top-color: #16181C"></span>
<span style="font-size: 13px; line-height: 20px; flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">正在读取 export/2019</span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">1:05</span>
</div>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 88px; box-sizing: border-box; padding: 8px 16px 0 16px; background: #FAFAF8">
<div style="height: 52px; box-sizing: border-box; padding: 0 6px 0 4px; display: flex; align-items: center; gap: 2px; background: #FFFFFF; border: 1px solid #E3E2DD; border-radius: 26px">
<button aria-label="添加图片" style="flex-shrink: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: none">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
</button>
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden">消息</label>
<input id="msg" type="text" placeholder="补充一句" style="flex-grow: 1; min-width: 0; height: 44px; padding: 0; background: none; border: none; outline: none; font: inherit; font-size: 15px; color: #16181C">
<span style="flex-shrink: 0; padding: 0 6px; font-size: 12px; color: #8A5200">上下文快满</span>
<button aria-label="停止。上下文快满了，长按看用量" style="flex-shrink: 0; width: 44px; height: 44px; margin-right: -2px; padding: 0; background: none; border: none; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18.5" stroke="#E3E2DD" stroke-width="2.5"></circle><circle cx="20" cy="20" r="18.5" stroke="#C77700" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="97.6 117" transform="rotate(-90 20 20)"></circle><circle cx="20" cy="20" r="14.5" fill="#16181C"></circle><rect x="15" y="15" width="10" height="10" rx="2.5" fill="#FFFFFF"></rect></svg>
</button>
</div>
</div>

</div>
</body>
</html>
