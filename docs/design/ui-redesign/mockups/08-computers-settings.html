<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>电脑与设置</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>

body{margin:0;background:#E9E8E3;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#16181C;text-decoration:none}a:hover{color:#000000}
</style>
</head>
<body>
<div style="width: 390px; height: 880px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #16181C; font-family: 'IBM Plex Sans SC', 'Noto Sans SC', sans-serif">

<div style="height: 60px; box-sizing: border-box; padding: 16px 8px 0 8px; display: flex; align-items: center; gap: 4px">
<a href="01-home.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
</div>

<div style="box-sizing: border-box; padding: 8px 20px 0 20px; display: flex; flex-direction: column">

<div style="font-size: 13px; line-height: 20px; color: #5F646C">电脑</div>

<div style="margin-top: 4px; display: flex; flex-direction: column">

<button style="padding: 12px 0; display: flex; align-items: center; gap: 12px; background: none; border: none; text-align: left">
<span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; line-height: 22px; font-weight: 500">工作电脑</span>
<span style="font-size: 13px; line-height: 18px; color: #5F646C">已连接，正在使用</span>
</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<button style="padding: 12px 0; display: flex; align-items: center; gap: 12px; background: none; border: none; border-top: 1px solid #E9E8E3; text-align: left">
<span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; line-height: 22px; font-weight: 500">开发服务器</span>
<span style="font-size: 13px; line-height: 18px; color: #5F646C">连不上，12 分钟前还在线</span>
</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<a href="09-computer-detail.html" style="padding: 12px 0; display: flex; align-items: center; gap: 12px; border-top: 1px solid #E9E8E3">
<span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; line-height: 22px; font-weight: 500">实验室服务器</span>
<span style="font-size: 13px; line-height: 18px; color: #B3261E">已拒绝连接，证书和配对时不一样</span>
</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<button style="padding: 12px 0; display: flex; align-items: center; gap: 12px; background: none; border: none; border-top: 1px solid #E9E8E3; text-align: left">
<span style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; line-height: 22px; font-weight: 500">家里的台式机</span>
<span style="font-size: 13px; line-height: 18px; color: #8A5200">DSH 版本不兼容，等插件更新</span>
</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<a href="10-add-computer.html" style="height: 52px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #E9E8E3; border-bottom: 1px solid #E9E8E3; font-size: 15px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
<span>添加电脑</span>
</a>

</div>

<div style="margin-top: 36px; font-size: 13px; line-height: 20px; color: #5F646C">提醒</div>

<div style="margin-top: 4px; padding: 12px 0; display: flex; align-items: center; gap: 12px">
<span id="notify-label" style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; line-height: 22px">需要我时通知</span>
<span style="font-size: 13px; line-height: 18px; color: #5F646C">审批、提问、任务结束</span>
</span>
<button role="switch" aria-checked="true" aria-labelledby="notify-label" style="flex-shrink: 0; width: 48px; height: 44px; padding: 8px 0; box-sizing: border-box; background: none; border: none; display: flex">
<span style="width: 48px; height: 28px; padding: 2px; box-sizing: border-box; background: #16181C; border-radius: 14px; display: flex; justify-content: flex-end">
<span style="width: 24px; height: 24px; border-radius: 12px; background: #FFFFFF"></span>
</span>
</button>
</div>

<button style="padding: 12px 0; display: flex; align-items: center; gap: 12px; background: none; border: none; border-top: 1px solid #E9E8E3; border-bottom: 1px solid #E9E8E3; text-align: left">
<span style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; line-height: 22px">锁屏后保持连接</span>
<span style="font-size: 13px; line-height: 18px; color: #8A5200">还差一步：关闭电池优化</span>
</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; font-size: 12px; line-height: 18px; color: #5F646C">DSHRemote <span style="font-family: 'JetBrains Mono', monospace">0.1.0-rc.1</span></div>

</div>
</body>
</html>
