name: android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  check:
    name: unit / lint / ktlint / assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # 校验提交的 gradle-wrapper.jar 是官方发布的版本，并缓存 Gradle 依赖
      - uses: gradle/actions/setup-gradle@v6
      # compileSdk 37（ADR 0011）：runner 上预装的 SDK 不一定包含
      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - run: ./gradlew test lint ktlintCheck assembleDebug
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: android/app/build/reports/
          retention-days: 7
