<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>对话分支</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>

body{margin:0;background:#E9E8E3;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#16181C;text-decoration:none}a:hover{color:#000000}
</style>
</head>
<body>
<div style="width: 390px; height: 880px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #16181C; font-family: 'IBM Plex Sans SC', 'Noto Sans SC', sans-serif">

<div style="height: 60px; box-sizing: border-box; padding: 16px 8px 0 8px; display: flex; align-items: center; gap: 4px; opacity: 0.4">
<a href="03-steps.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 15px; line-height: 22px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">修复重复通知</span>
<span style="font-size: 12px; line-height: 16px; color: #5F646C; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">工作电脑 · DSHRemote · 改文件不问</span>
</div>
</div>

<div style="box-sizing: border-box; padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 18px">

<div style="align-self: flex-end; max-width: 280px; padding: 9px 14px; background: #F1F0EC; border-radius: 18px; font-size: 15px; line-height: 24px; opacity: 0.4">通知里同一个审批会重复出现，帮我查一下原因并修掉。</div>

<p style="margin: 0; font-size: 15px; line-height: 26px; opacity: 0.4">找到原因了：两条路径去重用的键不一样。有两种修法，统一成一个键，或者只保留一条路径。</p>

<div style="align-self: flex-end; max-width: 280px; padding: 9px 14px; background: #FFFFFF; border-radius: 18px; box-shadow: 0 0 0 1.5px #16181C; font-size: 15px; line-height: 24px">用第一种，统一成一个键。</div>

<p style="margin: 0; font-size: 15px; line-height: 26px; opacity: 0.4">好，两处去重已经统一，并补了一个测试。</p>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 0 16px 28px 16px">
<div style="padding: 20px 16px 16px 16px; background: #FFFFFF; border: 1px solid #E3E2DD; border-radius: 22px; display: flex; flex-direction: column">
<div style="font-size: 15px; line-height: 22px; font-weight: 600">从这条消息另开一个对话</div>
<p style="margin: 8px 0 0 0; font-size: 13px; line-height: 21px; color: #5F646C">新对话带着这条消息之前的内容，你可以在那里换一种说法重新问。原来的对话不受影响。</p>
<p style="margin: 8px 0 0 0; font-size: 13px; line-height: 21px; color: #16181C">电脑上的文件不会变，也不会新建 Git 分支。</p>
<div style="margin-top: 16px; display: flex; gap: 8px">
<a href="03-steps.html" style="flex: 1 1 0; height: 44px; display: flex; align-items: center; justify-content: center; background: #F1F0EC; border-radius: 22px; font-size: 14px">取消</a>
<button style="flex: 1 1 0; height: 44px; background: #16181C; border: none; border-radius: 22px; font-size: 14px; font-weight: 600; color: #FFFFFF">另开对话</button>
</div>
</div>
</div>

</div>
</body>
</html>
