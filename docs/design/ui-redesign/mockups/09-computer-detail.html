<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>单台电脑</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>

body{margin:0;background:#E9E8E3;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer}
a{color:#16181C;text-decoration:none}a:hover{color:#000000}
</style>
</head>
<body>
<div style="width: 390px; height: 880px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAFAF8; color: #16181C; font-family: 'IBM Plex Sans SC', 'Noto Sans SC', sans-serif">

<div style="height: 60px; box-sizing: border-box; padding: 16px 8px 0 8px; display: flex; align-items: center; gap: 4px">
<a href="08-computers-settings.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16181C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
</div>

<div style="box-sizing: border-box; padding: 8px 20px 0 20px; display: flex; flex-direction: column">

<div style="font-size: 17px; line-height: 24px; font-weight: 600">实验室服务器</div>
<div style="margin-top: 2px; font-size: 13px; line-height: 20px; color: #B3261E">已拒绝连接</div>

<p style="margin: 16px 0 0 0; font-size: 15px; line-height: 26px">它出示的证书和配对时记下的不一样。可能是电脑重装过插件，也可能有人在冒充它。为了安全，不会继续连接。</p>

<a href="10-add-computer.html" style="margin-top: 16px; height: 48px; display: flex; align-items: center; justify-content: center; background: #16181C; border-radius: 24px; font-size: 15px; font-weight: 600; color: #FFFFFF">重新配对</a>

<div style="margin-top: 32px; display: flex; flex-direction: column">

<button style="height: 52px; padding: 0; display: flex; align-items: center; gap: 12px; background: none; border: none; border-top: 1px solid #E9E8E3; text-align: left">
<span style="flex-shrink: 0; width: 72px; font-size: 13px; color: #5F646C">名称</span>
<span style="flex: 1 1 0; min-width: 0; font-size: 15px">实验室服务器</span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F646C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</button>

<div style="height: 52px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #E9E8E3">
<span style="flex-shrink: 0; width: 72px; font-size: 13px; color: #5F646C">地址</span>
<span style="flex: 1 1 0; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px">192.168.1.42:3190</span>
</div>

<div style="height: 52px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #E9E8E3">
<span style="flex-shrink: 0; width: 72px; font-size: 13px; color: #5F646C">记下的指纹</span>
<span style="flex: 1 1 0; min-width: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">3F:A9:1C:…:7E:C2</span>
</div>

<div style="height: 52px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #E9E8E3; border-bottom: 1px solid #E9E8E3">
<span style="flex-shrink: 0; width: 72px; font-size: 13px; color: #5F646C">上次连上</span>
<span style="flex: 1 1 0; min-width: 0; font-size: 15px">3 天前</span>
</div>

</div>

<button style="margin-top: 12px; align-self: flex-start; height: 44px; padding: 0; background: none; border: none; font-size: 15px; color: #B3261E">移除这台电脑</button>

</div>

</div>
</body>
</html>
