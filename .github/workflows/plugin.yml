name: plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugin

jobs:
  check:
    name: lint / typecheck / unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  load:
    name: load in real dsh web (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      # npm 版的 dsh 安装插件时会调用 pnpm
      - run: npm install -g pnpm@10
      - name: Cache DSH install
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dsh-install
          key: dsh-${{ runner.os }}-node22-${{ hashFiles('plugin/src/dsh/versions.js') }}
      - run: npm run load-check
        env:
          DSH_INSTALL_DIR: ${{ runner.temp }}/dsh-install
