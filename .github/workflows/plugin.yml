name: plugin

on:
  push:
    branches: [main]
    paths:
      - 'plugin/**'
      - 'android/app/src/sharedTest/resources/plugin-certs/**'
      - '.github/workflows/plugin.yml'
  pull_request:
    paths:
      - 'plugin/**'
      - 'android/app/src/sharedTest/resources/plugin-certs/**'
      - '.github/workflows/plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugin

jobs:
  check:
    name: lint / typecheck / unit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # 用 runner 上预装的浏览器点一遍配对页（Edge 只在 Windows 上测，T10 的问题是在 Edge 上发现的）
      - run: npm run browser-check
      - if: runner.os == 'Windows'
        run: npm run browser-check
        env:
          BROWSER_CHANNEL: msedge

  load:
    name: load (source + package) + contract + e2e + dev-server in real dsh web (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      # npm 版的 dsh 安装插件时会调用 pnpm
      - run: npm install -g pnpm@10
      - name: Cache DSH install
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dsh-install
          key: dsh-${{ runner.os }}-node22-${{ hashFiles('plugin/src/dsh/versions.js') }}
      - run: npm run load-check
        env:
          DSH_INSTALL_DIR: ${{ runner.temp }}/dsh-install
      # 插件安装包（M3 T3）：打包并检查内容，再用它离线装进 dsh web 跑一遍加载检查
      - id: pack
        run: npm run pack -- --out "${{ runner.temp }}/plugin-package"
      - run: npm run load-check
        env:
          DSH_INSTALL_DIR: ${{ runner.temp }}/dsh-install
          DSHREMOTE_PLUGIN_PACKAGE: ${{ steps.pack.outputs.package }}
      # DSH 接口契约测试：假模型驱动真实 dsh web，逐项验证适配层依赖的接口
      - run: npm run contract
        env:
          DSH_INSTALL_DIR: ${{ runner.temp }}/dsh-install
      # 端到端测试：模拟手机走完配对、实时流、审批和提问、DSH 重启、撤销设备
      - run: npm run e2e
        env:
          DSH_INSTALL_DIR: ${{ runner.temp }}/dsh-install
      # 给 App 开发用的 dev-server：启动、配对、流式对话、重启 DSH、撤销、停止后指纹不变
      - run: npm run dev-server-check
        env:
          DSH_INSTALL_DIR: ${{ runner.temp }}/dsh-install
